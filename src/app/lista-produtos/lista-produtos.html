

<div id="div-from">
    <h2>Lista de Produtos</h2>

    <form id="formulario">
        <label for="descricao">Descrição</label>
        <input type="text" name="descricao" id="descricao">

        <label for="valor_unitario">Valor Unitário</label>
        <input type="number" name="valor_unitario" id="valor_unitario" [(ngModel)] ="valor_unitario">

        <div id="div-btns">
            <button type="submit" id="btnAdd" (click) = "addItem()">Adicionar</button>
            <button type="button" id="btnLimpar" (click) = "limparTudo" >Limpar</button>
        </div>
    </form>

    <div id="div-lista">

        @for(elem of listaItens; track elem.idProduto){
            
            <div class="div-item">
                <input type="checkbox"> &nbsp; {{elem.idProduto}} - {{elem.descricaoProduto}} - R$ {{elem.valorUnitario?.toFixed (2)?.replace('.','.')}}</div>
        }@empty{
            <div class="div-item">Nenhum Item Adicionado!!!</div>
        }

    </div>

</div>
